name: khade_customer
description: KHADE — discover and book beauty & wellness professionals.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  supabase_flutter: ^2.5.0          # Auth + DB + Storage
  google_maps_flutter: ^2.6.0       # Map view / nearby
  geolocator: ^12.0.0               # Device location for nearby search
  webview_flutter: ^4.7.0           # Paystack checkout (hosted page)
  url_launcher: ^6.3.0
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.0       # Push notifications
  firebase_analytics: ^11.0.0
  intl: ^0.19.0
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
